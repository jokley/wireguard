# Enabled through nginx/vhosts-enabled; configuration source of truth.
server {
    listen 443 ssl;
    server_name ssh.jokley.at;

    ssl_certificate     /etc/letsencrypt/live/ssh.jokley.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ssh.jokley.at/privkey.pem;

    # Same Authelia headers/endpoints as includes/authelia.conf, scoped here
    # because its /static/ alias conflicts with WebSSH assets.

    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    location /auth/ {
        proxy_pass http://authelia:9091/auth/;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /auth;
    }

    location = /authelia-auth {
        internal;

        proxy_pass http://authelia:9091/auth/api/authz/auth-request;

        proxy_pass_request_body off;
        proxy_set_header Content-Length "";

        proxy_set_header X-Original-Method $request_method;
        proxy_set_header X-Original-URL    $scheme://$http_host$request_uri;

        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Cookie            $http_cookie;
    }

    # Preserve WebSSH's /static/ URI and prevent regex asset interception.
    location ^~ /static/ {
        include /etc/nginx/includes/authelia-authrequest.conf;

        proxy_pass http://webssh:8080;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        include /etc/nginx/includes/authelia-authrequest.conf;

        proxy_pass http://webssh:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 300;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @handle_unauthorized {
        return 302 https://$server_name/auth?redirect=$target_url;
    }
}
