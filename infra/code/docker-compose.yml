# External networks (including dev-net owned by infra/dev) must exist before
# deployment. No Docker socket or application deployment permissions are granted.
services:
  code-server:
    build:
      context: .
      args:
        CODE_SERVER_VERSION: "4.139.1"
    image: infra-code-server:4.139.1
    container_name: code-server
    restart: unless-stopped
    env_file:
      - .env
    command:
      - --config
      - /etc/code-server/config.yaml
      - --bind-addr
      - 0.0.0.0:8080
      - --auth
      - password
      - /workspace
    expose:
      - "8080"
    volumes:
      - type: bind
        source: ${WORKSPACE_DIR:-/home/Projects}
        target: /workspace
      - type: bind
        source: ${CODE_SERVER_STATE_DIR:-./state/code-server}
        target: /home/coder/.local/share/code-server
      - type: volume
        source: incoming-test-postgres-backups
        target: /backups
        read_only: true
    cap_drop:
      - ALL
    cap_add:
      # NET_ADMIN installs the namespace-local route. SETUID/SETGID let gosu
      # permanently switch from the root wrapper to coder:coder afterwards.
      - NET_ADMIN
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    networks:
      edge-net: {}
      ops-net: {}
      dev-net:
        # Do not let the new development network replace an existing default route.
        gw_priority: -1

networks:
  edge-net:
    external: true
    name: edge-net
  ops-net:
    external: true
    name: ops-net
  dev-net:
    external: true
    name: dev-net

volumes:
  incoming-test-postgres-backups:
    external: true
    name: incoming-test-postgres-backups
