<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Jokley Infrastructure</title>
  <style>
    :root { font-family: system-ui, sans-serif; color: #e7edf7; background: #101723; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; padding: 2rem 1rem; }
    main { width: 100%; max-width: 48rem; }
    h1 { font-size: clamp(1.8rem, 5vw, 3rem); margin: 0 0 .5rem; letter-spacing: -.04em; }
    p { color: #aebed4; margin: 0 0 2rem; }
    ul { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr)); gap: 1rem; list-style: none; padding: 0; margin: 0; }
    a { display: block; height: 100%; padding: 1.5rem; border: 1px solid #34445b; border-radius: .8rem; background: #192435; color: inherit; text-decoration: none; }
    a:hover { background: #233249; border-color: #92b8f0; }
    a:focus-visible { outline: 3px solid #92b8f0; outline-offset: 4px; }
    strong { display: block; font-size: 1.15rem; margin-bottom: .5rem; }
    span { color: #aebed4; overflow-wrap: anywhere; }
    @media (prefers-color-scheme: light) {
      :root { color: #152238; background: #f4f7fb; }
      p, span { color: #485d79; }
      a { background: white; border-color: #c6d2e2; }
      a:hover { background: #e8eff9; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Jokley Infrastructure</h1>
    <p>Infrastructure Services</p>
    <ul>
      <li><a href="https://code.jokley.at"><strong>Code Server</strong><span>code.jokley.at</span></a></li>
      <li><a href="https://ssh.jokley.at"><strong>WebSSH</strong><span>ssh.jokley.at</span></a></li>
      <li><a href="https://wg.jokley.at"><strong>WireGuard</strong><span>wg.jokley.at</span></a></li>
      <li><a href="https://incoming.jokley.at"><strong>Incoming</strong><span>incoming.jokley.at</span></a></li>
    </ul>
  </main>
</body>
</html>
