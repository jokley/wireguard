# Incoming TEST: separate upstream and runtime secret; access is restricted by Authelia.
server {
    listen 443 ssl;
    server_name test.incoming.jokley.at;
    client_max_body_size 100m;

    ssl_certificate     /etc/letsencrypt/live/test.incoming.jokley.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test.incoming.jokley.at/privkey.pem;

    include /etc/nginx/includes/authelia.conf;

    location / {
        include /etc/nginx/includes/authelia-authrequest.conf;

        proxy_pass http://incoming-test-nginx:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/ {
        include /etc/nginx/includes/authelia-authrequest.conf;
        include /etc/nginx/runtime/incoming-test-secret.conf;

        proxy_pass http://incoming-test-nginx:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @handle_unauthorized {
        return 302 https://$server_name/auth?redirect=$target_url;
    }
}
