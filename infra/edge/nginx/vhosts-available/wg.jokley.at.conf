# Enabled through nginx/vhosts-enabled; configuration source of truth.
server {
    listen 443 ssl;
    server_name wg.jokley.at;

    ssl_certificate     /etc/letsencrypt/live/wg.jokley.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wg.jokley.at/privkey.pem;

    include /etc/nginx/includes/authelia.conf;

    location / {
        include /etc/nginx/includes/authelia-authrequest.conf;

        proxy_pass http://wg-easy:51821;
        proxy_http_version 1.1;
        proxy_read_timeout 300;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @handle_unauthorized {
        return 302 https://$server_name/auth?redirect=$target_url;
    }
}
